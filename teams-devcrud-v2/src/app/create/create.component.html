<h2 class="display-6 mb-5">Create developer</h2>

<div class="input-group mb-3" (click)="showExplanation()">
	<span class="input-group-text">
		<i class="bi bi-fingerprint me-3"></i>
		ID
	</span>
	<input type="text" readonly class="form-control" [(ngModel)]="developer.id">
</div>

<div class="input-group mb-3">
    <span class="input-group-text">
			<i class="bi bi-person me-3"></i>
			Name
		</span>
    <input type="text" class="form-control" [(ngModel)]="developer.name">
</div>

<div class="input-group mb-3">
    <span class="input-group-text">
			<i class="bi bi-envelope me-3"></i>
			Email
		</span>
    <input type="text" class="form-control" [(ngModel)]="developer.email">
</div>

<div class="input-group mb-3">
    <span class="input-group-text">
			<i class="bi bi-briefcase me-3"></i>
			Job
		</span>
    <input type="text" class="form-control" [(ngModel)]="developer.job">
</div>

<div class="input-group mb-3">
    <span class="input-group-text">
			<i class="bi bi-calendar me-3"></i>
			Age
		</span>
    <input type="number" class="form-control" [(ngModel)]="developer.age">
</div>

<div class="input-group mb-3">
    <span class="input-group-text">
			<i class="bi bi-cash-stack me-3"></i>
			Salary
		</span>
    <input type="number" class="form-control" [(ngModel)]="developer.salary">
</div>

<div class="input-group mb-3">
    <span class="input-group-text">
			<i class="bi bi-image me-3"></i>
			Image URL
		</span>
    <input type="text" class="form-control" [(ngModel)]="developer.image">
</div>

<div class="input-group mb-3">
    <span class="input-group-text">
			<i class="bi bi-tools me-3"></i>
			Skills (comma separated)
		</span>
    <input type="text" class="form-control" [(ngModel)]="developer.skillsAsString">
</div>

<button class="btn btn-success" (click)="save()">
	<i class="bi bi-plus-circle me-1"></i>
	Create developer
</button>




<div class="alert alert-primary" role="alert" *ngIf="showAlert">
  <h4 class="alert-heading">
		<i class="bi bi-info-circle me-1"></i>
		INFO
	</h4>
  <hr>
  <p class="mb-0">ID is generated by the frontend, using GUID structure. User is not able to change it through the application.</p>
	<hr>
  <p class="mb-0">If you have any question, let us know: support&#64;sztspec.io</p>
</div>
